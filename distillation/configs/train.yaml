# Training config for Wikontic distillation — v3
# (stronger LoRA, relation-weighted loss, cosine LR)
# Paths are resolved relative to the directory where train.py lives.

train_path: "./data/train.jsonl"
val_path: "./data/val.jsonl"
test_path: "./data/test.jsonl"
system_prompt_path: "../src/wikontic/utils/prompts/triplet_extraction/propmt_1_types_qualifiers.txt"
output_dir: "./checkpoints/wikontic-v3"

# Model
base_model: "HuggingFaceTB/SmolLM2-1.7B-Instruct"

# Quantization (QLoRA)
load_in_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_compute_dtype: "bfloat16"

# LoRA
lora_r: 16
lora_alpha: 64                        # stronger update (doubled from 32)
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"

# Training hyperparameters
num_train_epochs: 5                   # more epochs
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
warmup_steps: 100
logging_steps: 10
save_steps: 1000
eval_strategy: "steps"
eval_steps: 1000
bf16: true
dataloader_num_workers: 0
save_total_limit: 2
report_to: "none"

# ---------------------------------------------------------------------------
# Curriculum scheduler
# ---------------------------------------------------------------------------
curriculum:
  enabled: true
  stages:
    - until_step: 300
      max_triplets: 8

# ---------------------------------------------------------------------------
# Loss down-weighting for "instance of"
# ---------------------------------------------------------------------------
instance_of_weight: 0.1

# ---------------------------------------------------------------------------
# Relation-aware loss weighting
# ---------------------------------------------------------------------------
# Relations with training precision < threshold get their loss up-weighted.
# This forces the model to focus on low-recall relations.
relation_weighting:
  enabled: true
  # These relations have low precision in the current model → up-weight them
  up_weight_relations:
    - "has part(s)"
    - "notable work"
    - "position held"
    - "inception"
    - "genre"
    - "film crew member"
    - "named after"
    - "location"
  up_weight: 2.0          # loss multiplier for under-performing relations
  down_weight_relations:  # high-precision "safe" relations → down-weight slightly
    - "instance of"
    - "date of birth"
    - "occupation"
    - "country of citizenship"
    - "country of origin"
  down_weight: 0.5
