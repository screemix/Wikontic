# Training config for Wikontic distillation — v2
# (softened curriculum, stronger instance_of suppression, SFTTrainer)
# Paths are resolved relative to the directory where train.py lives.

train_path: "./data/train.jsonl"
val_path: "./data/val.jsonl"
system_prompt_path: "../src/wikontic/utils/prompts/triplet_extraction/propmt_1_types_qualifiers.txt"
output_dir: "./checkpoints/wikontic-v2"

# Model
base_model: "HuggingFaceTB/SmolLM2-1.7B-Instruct"

# Quantization (QLoRA)
load_in_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_compute_dtype: "bfloat16"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"

# Training hyperparameters
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
warmup_steps: 100
logging_steps: 10
save_steps: 1000
eval_strategy: "steps"
eval_steps: 1000
bf16: true
dataloader_num_workers: 0
save_total_limit: 2
report_to: "none"

# ---------------------------------------------------------------------------
# Curriculum scheduler
# ---------------------------------------------------------------------------
# Stage 1 (steps 0–300): start at max_triplets=8 (close to the dataset median
#   of 11), so the model learns the full JSON structure from the beginning
#   while still seeing a manageable number of relations per example.
#   "instance of" triplets are always sorted first, so they dominate this
#   stage naturally.
# Stage 2 (steps 300+): full examples — the automatically-appended unlimited
#   stage takes over and the model learns to extract all relations.
curriculum:
  enabled: true
  stages:
    - until_step: 300
      max_triplets: 8

# ---------------------------------------------------------------------------
# Loss down-weighting for "instance of"
# ---------------------------------------------------------------------------
# Applied ONLY to tokens inside the completion (labels != -100).
# 0.1 = strongly suppress; 1.0 = no effect.
instance_of_weight: 0.1
